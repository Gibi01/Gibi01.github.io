services:
  - type: web
    name: hospital-ripper-api
    runtime: node
    plan: free
    rootDir: backend-dsw
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm run build
    startCommand: node dist/app.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Argentina/Buenos_Aires
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: APP_ORIGIN
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: Hospital Ripper
